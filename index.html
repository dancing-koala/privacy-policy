<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policies — CoBru</title>
    <meta name="description" content="Privacy policies of the Android apps by CoBru.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --bg: #fafaf8;
        --surface: #ffffff;
        --hover: #f3f4f6;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #f5f5f4;
          --muted: #9ca3af;
          --border: #2a2a2a;
          --bg: #111111;
          --surface: #1a1a1a;
          --hover: #222222;
        }
      }

      :root[data-theme="dark"] {
        --ink: #f5f5f4;
        --muted: #9ca3af;
        --border: #2a2a2a;
        --bg: #111111;
        --surface: #1a1a1a;
        --hover: #222222;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', -apple-system, 'Roboto', sans-serif;
        font-weight: 300;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding: 80px 32px 64px;
      }

      h1 {
        font-size: clamp(32px, 6vw, 44px);
        font-weight: 400;
        letter-spacing: -1px;
        line-height: 1.1;
        margin-bottom: 12px;
      }

      .intro {
        color: var(--muted);
        margin-bottom: 40px;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      a.app {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: inherit;
        text-decoration: none;
        transition: background 0.15s;
      }

      a.app:hover,
      a.app:focus-visible {
        background: var(--hover);
      }

      .swatch {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }

      .name {
        font-weight: 500;
        font-size: 17px;
      }

      .desc {
        color: var(--muted);
        font-size: 14px;
      }

      .arrow {
        margin-left: auto;
        color: var(--muted);
        font-size: 18px;
      }

      footer {
        border-top: 1px solid var(--border);
        padding: 24px 32px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }

      footer a {
        color: inherit;
      }

      @media (max-width: 600px) {
        main {
          padding: 56px 16px 48px;
        }
        footer {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Privacy Policies</h1>
      <p class="intro">Choose an app to read its privacy policy.</p>
      <ul>
        <li>
          <a class="app" href="breathe/">
            <span class="swatch" style="background: #9b8ec4;"></span>
            <span><span class="name">Breathe.</span><br><span class="desc">Breathing exercises</span></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a class="app" href="zenflow/">
            <span class="swatch" style="background: #4a7c6f;"></span>
            <span><span class="name">ZenFlow</span><br><span class="desc">Guided breathing</span></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a class="app" href="launchers/oh-hi-launcher.html">
            <span class="swatch" style="background: #1a1e1d; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);"></span>
            <span><span class="name">Oh Hi Launcher</span><br><span class="desc">Minimal, text-only home screen</span></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a class="app" href="launchers/lens-launcher.html">
            <span class="swatch" style="background: radial-gradient(circle, #fff 0 22%, rgba(255,255,255,0.45) 23% 34%, #000 35%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);"></span>
            <span><span class="name">Lentille Launcher</span><br><span class="desc">Honeycomb home screen</span></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </main>
    <footer>
      <p>CoBru · <a href="mailto:support-cobr@pm.me">support-cobr@pm.me</a></p>
    </footer>
  </body>
</html>
